[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylatro"
version = "0.1.0"
description = "Headless Python recreation of Balatro core logic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lupa>=2.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.22",
    "pytest>=8.3.5",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pylatro"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
