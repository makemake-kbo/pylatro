[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylatro"
version = "0.1.0"
description = "Headless Python recreation of Balatro core logic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lupa>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pylatro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
