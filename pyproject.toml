[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylatro"
version = "0.1.0"
description = "Headless Python recreation of Balatro core logic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = [
    "textual>=1.0",
]
agent = [
    "torch>=2.0",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "tensorboard>=2.14",
]

[project.scripts]
pylatro = "pylatro_cli.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.22",
    "cython>=3.2.4",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "textual-dev>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pylatro", "src/pylatro_cli", "src/pylatro_agent"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
asyncio_mode = "auto"
